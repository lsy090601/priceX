    <g transform="translate(18 574)"><rect width="224" height="48" rx="12" fill="#fff" stroke="#E1E7E2"/><text x="14" y="29" class="body">롯데마트 서울역점</text><text x="158" y="29" class="label">4,120원</text></g>
