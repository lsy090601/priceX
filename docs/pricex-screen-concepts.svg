    <rect x="18" y="432" width="224" height="148" rx="17" fill="#F0F8F2"/><circle cx="38" cy="456" r="12" fill="#087A37"/><text x="33" y="461" font-size="12" fill="#fff">✦</text><text x="58" y="461" class="label greenText">PriceX 조언</text><text x="34" y="491" class="body">배추는 평년보다 높은 편이에요.</text><text x="34" y="514" class="body">이번 주에는 필요한 양만 사고,</text><text x="34" y="537" class="body">라면은 현재 가격에 구매해도 좋아요.</text><text x="34" y="563" class="small">AI 연결 실패 시 계산 결과로 안내합니다.</text>
