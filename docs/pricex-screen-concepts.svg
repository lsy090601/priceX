    <g transform="translate(136 570)"><rect width="106" height="82" rx="15" fill="#F0F8F2"/><circle cx="24" cy="25" r="13" fill="#CFE8D6"/><text x="17" y="30" font-size="14">↗</text><text x="14" y="56" class="label">가격 예측</text><text x="14" y="72" class="small">254개 상품</text></g>
    <line x1="18" y1="710" x2="242" y2="710" stroke="#E4E9E5"/>
    <text x="32" y="744" font-size="18" fill="#087A37">⌂</text><text x="96" y="744" font-size="18" fill="#A7B0A9">⌕</text><text x="162" y="744" font-size="18" fill="#A7B0A9">☑</text><text x="220" y="744" font-size="18" fill="#A7B0A9">○</text>
    <text x="22" y="768" font-size="10" fill="#087A37">홈</text><text x="86" y="768" font-size="10" fill="#88938A">검색</text><text x="145" y="768" font-size="10" fill="#88938A">장보기</text><text x="207" y="768" font-size="10" fill="#88938A">MY</text>
