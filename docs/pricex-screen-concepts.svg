    <g transform="translate(18 240)"><rect width="224" height="62" rx="14" fill="#fff" stroke="#E1E7E2"/><circle cx="26" cy="31" r="14" fill="#EAF6ED"/><text x="21" y="36" font-size="15">1</text><text x="52" y="26" class="label">전통시장</text><text x="52" y="46" class="small">배추 · 대파</text><text x="166" y="36" class="label">4,300원</text></g>
