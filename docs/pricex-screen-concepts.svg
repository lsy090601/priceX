    <g transform="translate(18 174)"><rect width="224" height="112" rx="16" fill="#fff" stroke="#E1E7E2"/><text x="14" y="25" class="label">신라면 (5개입)</text><text x="14" y="48" class="small">농심 · 조사일 2026.09.25</text><text x="14" y="78" font-size="19" font-weight="700" fill="#13291A">최저 3,980원</text><text x="14" y="98" class="small">평균 4,180원 · 38개 매장</text><rect x="168" y="69" width="40" height="22" rx="11" fill="#EAF6ED"/><text x="178" y="84" font-size="10" fill="#087A37">보통</text></g>
    <g transform="translate(18 298)"><rect width="224" height="112" rx="16" fill="#fff" stroke="#E1E7E2"/><text x="14" y="25" class="label">진라면 순한맛 (5개입)</text><text x="14" y="48" class="small">오뚜기 · 조사일 2026.09.25</text><text x="14" y="78" font-size="19" font-weight="700" fill="#13291A">최저 3,780원</text><text x="14" y="98" class="small">평균 3,992원 · 41개 매장</text><rect x="168" y="69" width="40" height="22" rx="11" fill="#EAF6ED"/><text x="178" y="84" font-size="10" fill="#087A37">보통</text></g>
    <g transform="translate(18 422)"><rect width="224" height="112" rx="16" fill="#fff" stroke="#E1E7E2"/><text x="14" y="25" class="label">삼양라면 (5개입)</text><text x="14" y="48" class="small">삼양식품 · 조사일 2026.09.25</text><text x="14" y="78" font-size="19" font-weight="700" fill="#13291A">최저 2,980원</text><text x="14" y="98" class="small">평균 3,120원 · 35개 매장</text><rect x="168" y="69" width="40" height="22" rx="11" fill="#FFF3D8"/><text x="178" y="84" font-size="10" fill="#9A6A00">저렴</text></g>
