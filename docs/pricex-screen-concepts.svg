    <g transform="translate(18 350)">
      <rect width="224" height="76" rx="14" fill="#fff" stroke="#E1E7E2"/>
      <text x="14" y="24" class="label">배추 (1.5~2kg)</text><text x="14" y="47" class="small">평균 3,420원</text>
      <rect x="157" y="18" width="51" height="25" rx="12" fill="#FDECEC"/><text x="170" y="35" font-family="Arial" font-size="11" fill="#C93D3D">+8.2%</text>
      <text x="157" y="61" class="small">상승 가능성</text>
    </g>
    <g transform="translate(18 438)">
