    <g transform="translate(18 188)"><rect width="224" height="94" rx="15" fill="#fff" stroke="#E1E7E2"/><circle cx="20" cy="25" r="9" fill="#087A37"/><text x="17" y="29" font-size="10" fill="#fff">✓</text><text x="40" y="29" class="label">배추 (1.5~2kg)</text><text x="40" y="54" class="small">예상 3,420원</text><rect x="136" y="57" width="72" height="25" rx="12" fill="#F3F6F3"/><text x="147" y="74" class="small">−  1  ＋</text></g>
    <g transform="translate(18 294)"><rect width="224" height="94" rx="15" fill="#fff" stroke="#E1E7E2"/><circle cx="20" cy="25" r="9" fill="#fff" stroke="#AEB8B0"/><text x="40" y="29" class="label">신라면 (5개입)</text><text x="40" y="54" class="small">예상 4,180원</text><rect x="136" y="57" width="72" height="25" rx="12" fill="#F3F6F3"/><text x="147" y="74" class="small">−  2  ＋</text></g>
    <g transform="translate(18 400)"><rect width="224" height="94" rx="15" fill="#fff" stroke="#E1E7E2"/><circle cx="20" cy="25" r="9" fill="#fff" stroke="#AEB8B0"/><text x="40" y="29" class="label">돼지고기 삼겹살</text><text x="40" y="54" class="small">예상 12,520원</text><rect x="136" y="57" width="72" height="25" rx="12" fill="#F3F6F3"/><text x="147" y="74" class="small">−  1  ＋</text></g>
    <rect x="18" y="530" width="224" height="52" rx="14" fill="#087A37"/><text x="65" y="563" font-size="14" font-weight="700" fill="#fff">최적 구매처 알아보기</text>
    <rect x="18" y="594" width="224" height="52" rx="14" fill="#fff" stroke="#087A37"/><text x="78" y="627" font-size="14" font-weight="700" fill="#087A37">상품 더 추가하기</text>
  </g>

  <!-- Phone 5 -->
