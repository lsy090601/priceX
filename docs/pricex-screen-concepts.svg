    <text x="34" y="232" font-family="Arial,'Noto Sans KR'" font-size="12" fill="#CDE8D5">이번 달 장보기</text>
    <text x="34" y="260" font-family="Arial,'Noto Sans KR'" font-size="24" font-weight="700" fill="#fff">예상 42,300원</text>
    <text x="34" y="281" font-family="Arial,'Noto Sans KR'" font-size="11" fill="#E4F4E8">목록 7개 · 2개 구매 완료</text>
