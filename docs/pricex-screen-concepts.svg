<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1060" viewBox="0 0 1500 1060">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#173521" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:#102618}.sub{font:400 15px Arial,'Noto Sans KR',sans-serif;fill:#647267}
      .screenTitle{font:700 20px Arial,'Noto Sans KR',sans-serif;fill:#13291a}.body{font:400 13px Arial,'Noto Sans KR',sans-serif;fill:#26382b}
      .small{font:400 11px Arial,'Noto Sans KR',sans-serif;fill:#7a877d}.label{font:700 12px Arial,'Noto Sans KR',sans-serif;fill:#26382b}
      .green{fill:#087a37}.greenText{fill:#087a37}.white{fill:#fff}.bold{font-weight:700}
    </style>
  </defs>
  <rect width="1500" height="1060" fill="#F3F7F3"/>
  <text x="70" y="62" class="title">PriceX 핵심 화면 예시</text>
  <text x="70" y="92" class="sub">공공 가격 비교 → 예측 → 장보기 → 최적 구매처 추천 흐름</text>

  <!-- Phone 1 -->
  <g transform="translate(48 130)" filter="url(#shadow)">
    <rect width="260" height="780" rx="32" fill="#fff"/>
    <rect x="92" y="12" width="76" height="6" rx="3" fill="#DCE4DD"/>
    <text x="22" y="58" font-family="Arial" font-size="20" font-weight="800" fill="#087A37">PRICEX</text>
    <text x="22" y="91" class="screenTitle">오늘 뭐 사세요?</text>
    <text x="22" y="116" class="small">가격을 검색하고 살 시점을 확인해 보세요.</text>
    <rect x="18" y="138" width="224" height="50" rx="14" fill="#F3F6F3" stroke="#D9E1DA"/>
    <circle cx="39" cy="163" r="7" fill="none" stroke="#718077" stroke-width="2"/><line x1="44" y1="168" x2="49" y2="173" stroke="#718077" stroke-width="2"/>
    <text x="59" y="168" class="body" fill="#89948C">배추, 우유, 라면 검색</text>
