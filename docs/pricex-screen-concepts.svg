    <g transform="translate(96 220)"><rect width="68" height="74" rx="13" fill="#F7F9F7"/><text x="12" y="23" class="small">평균가</text><text x="12" y="49" font-size="16" font-weight="700" fill="#13291A">4,180</text><text x="12" y="65" class="small">원</text></g>
    <g transform="translate(174 220)"><rect width="68" height="74" rx="13" fill="#F7F9F7"/><text x="12" y="23" class="small">최고가</text><text x="12" y="49" font-size="16" font-weight="700" fill="#C84B43">4,650</text><text x="12" y="65" class="small">원</text></g>
